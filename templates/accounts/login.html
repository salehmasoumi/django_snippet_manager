{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-card" style="max-width:420px;margin:2rem auto;padding:1.5rem;">
  <h2>Login</h2>
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.GET.next }}">
    {% for field in form %}
      <div style="margin-bottom:0.8rem;">
        <label>{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}<div class="alert alert-error">{{ error }}</div>{% endfor %}
      </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Login</button>
  </form>
  <p style="margin-top:1rem;color:var(--mist);">
    <a href="{% url 'accounts:password_reset' %}">Forgot password?</a> ·
    No account? <a href="{% url 'accounts:register' %}">Register</a>
  </p>
</div>
{% endblock %}
